<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Bruvanz — Menu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Mulish:wght@400;500;700&family=Kalam:wght@400;700&display=swap');

  :root{
    color-scheme: light only;
    --paper:#FFFFFF;
    --cream:#FBF9F3;
    --ink:#1A1A1A;
    --olive:#7C9A4C;
    --olive-dark:#4A5E2C;
    --brown:#6E4520;
    --muted:#6B6558;
    --line:#EAE6DA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{color-scheme: light only;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Mulish', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 20px 60px;}

  header.hero{
    background:var(--paper);
    text-align:center;
    padding:36px 24px 20px;
    border-bottom:3px solid var(--ink);
  }
  header.hero img.banner{
    width:100%;
    max-width:320px;
    height:auto;
    display:block;
    margin:0 auto;
  }
  header.hero p.tag{
    font-family:'Kalam', cursive;
    font-size:15px;
    color:var(--brown);
    margin-top:10px;
  }
  header.hero .loc{
    display:inline-block;
    margin-top:14px;
    padding:5px 14px;
    background:var(--olive);
    color:#fff;
    font-size:12px;
    font-weight:700;
    border-radius:100px;
    letter-spacing:0.02em;
  }

  nav.jump{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:16px 20px;
    background:var(--cream);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:5;
    scrollbar-width:none;
  }
  nav.jump::-webkit-scrollbar{display:none;}
  nav.jump button{
    flex:0 0 auto;
    font-family:'Mulish', sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    background:var(--paper);
    border:1.5px solid var(--ink);
    border-radius:100px;
    padding:8px 16px;
    cursor:pointer;
  }
  nav.jump button.active{
    background:var(--ink);
    color:#fff;
  }

  section.category{padding-top:34px;scroll-margin-top:70px;}
  section.category h2{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:23px;
    color:var(--ink);
  }
  section.category .sub{
    font-family:'Kalam', cursive;
    font-size:14px;
    color:var(--brown);
    margin-top:2px;
    margin-bottom:16px;
  }

  .item{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    margin-bottom:12px;
  }
  .item .thumb{
    width:64px;height:64px;
    border-radius:10px;
    flex:0 0 auto;
    overflow:hidden;
    background:#F1EEE3;
    display:flex;align-items:center;justify-content:center;
  }
  .item .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .item .thumb svg{width:30px;height:30px;stroke:var(--olive-dark);}

  .item .info{flex:1;min-width:0;}
  .item .info .name{font-family:'Baloo 2', sans-serif;font-size:16px;font-weight:700;}
  .item .info .desc{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4;}
  .item .price{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--olive-dark);
    white-space:nowrap;
    padding-left:6px;
  }

  footer{
    margin-top:44px;
    padding-top:26px;
    border-top:1px solid var(--line);
    text-align:center;
  }
  footer img.mark{width:56px;height:56px;object-fit:contain;margin:0 auto 10px;display:block;}
  footer p{font-size:12.5px;color:var(--muted);margin-top:4px;}
</style>
</head>

<script>
/* ======================================================================
   EDIT YOUR MENU HERE
   ----------------------------------------------------------------------
   - To change a name, price, or description: edit the text inside the
     quotes " " below.
   - To add a photo: take a photo, upload it anywhere that gives you a
     direct image link (e.g. imgur.com, or a Google Drive "share" link
     set to "anyone with the link"), then paste that link inside the
     img: "" quotes for that item. Leave img: "" empty to keep the
     placeholder icon.
   - To add a new item: copy one whole { ... }, block, paste it above
     or below, and change the details.
   - To add a whole new category: copy one whole category block
     (starting with { category: ... and ending with ] }, ), and edit it.
   ====================================================================== */

const menu = [
  {
    category: "Hot coffees",
    sub: "brewed fresh, cup by cup",
    icon: "coffee",
    items: [
      { name: "Cappuccino", desc: "Espresso, steamed milk, thick foam", price: "220", img: "" },
      { name: "Café latte", desc: "Smooth espresso with silky milk", price: "230", img: "" },
      { name: "Black coffee", desc: "Single origin, no milk", price: "160", img: "" },
    ]
  },
  {
    category: "Cold drinks",
    sub: "for the warm Sylhet afternoons",
    icon: "glass",
    items: [
      { name: "Iced latte", desc: "Double espresso over cold milk", price: "250", img: "" },
      { name: "Cold brew", desc: "Slow steeped, 18 hours", price: "260", img: "" },
      { name: "Lemon mint cooler", desc: "Fresh lemon, mint, soda", price: "180", img: "" },
    ]
  },
  {
    category: "Fried & crispy",
    sub: "golden, crunchy, made to order",
    icon: "chicken",
    items: [
      { name: "Chicken strips", desc: "Five pieces, house dip", price: "320", img: "" },
      { name: "Fried chicken", desc: "Two pieces, spiced crust", price: "350", img: "" },
      { name: "Loaded fries", desc: "Cheese, spice mix, crispy onions", price: "260", img: "" },
    ]
  },
  {
    category: "Cakes & desserts",
    sub: "save a little room",
    icon: "cake",
    items: [
      { name: "Chocolate lava cake", desc: "Served warm, vanilla scoop", price: "280", img: "" },
      { name: "Red velvet slice", desc: "Cream cheese frosting", price: "240", img: "" },
    ]
  },
];

/* ======================================================================
   DISPLAY CODE — you shouldn't need to touch anything below this line
   ====================================================================== */

const icons = {
  coffee: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"/><path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c0 .8-1 1-1 2s1 1.2 1 2"/><path d="M12 3c0 .8-1 1-1 2s1 1.2 1 2"/></svg>',
  glass:  '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l-1.5 15a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2L6 3Z"/><path d="M7 9h10"/></svg>',
  chicken:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4c3 0 5 2.5 5 5.5 0 2-1 3.5-2.5 4.8L15 18a2 2 0 0 1-3 2.5l-2-2"/><path d="M6 12c-1.5 0-3-1-3-3s1.2-3.3 3-3"/></svg>',
  cake:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7Z"/><path d="M4 11l2-3h12l2 3"/><path d="M12 8V4"/><path d="M12 4c-.8 0-1.4-.6-1.4-1.4S11.2 1 12 1s1.4.7 1.4 1.6c0 .8-.6 1.4-1.4 1.4Z"/></svg>'
};

const root = document.getElementById("menuRoot");
const nav = document.getElementById("jumpNav");

menu.forEach((cat, i) => {
  const slug = "cat-" + i;

  const btn = document.createElement("button");
  btn.textContent = cat.category;
  btn.onclick = () => document.getElementById(slug).scrollIntoView({behavior:"smooth"});
  nav.appendChild(btn);

  const section = document.createElement("section");
  section.className = "category";
  section.id = slug;

  const h2 = document.createElement("h2");
  h2.textContent = cat.category;
  const sub = document.createElement("p");
  sub.className = "sub";
  sub.textContent = cat.sub || "";
  section.appendChild(h2);
  section.appendChild(sub);

  cat.items.forEach(it => {
    const row = document.createElement("div");
    row.className = "item";

    const thumb = document.createElement("div");
    thumb.className = "thumb";
    if (it.img) {
      const img = document.createElement("img");
      img.src = it.img;
      img.alt = it.name;
      thumb.appendChild(img);
    } else {
      thumb.innerHTML = icons[cat.icon] || icons.coffee;
    }

    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = `<div class="name">${it.name}</div><div class="desc">${it.desc}</div>`;

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = it.price + " ৳";

    row.appendChild(thumb);
    row.appendChild(info);
    row.appendChild(price);
    section.appendChild(row);
  });

  root.appendChild(section);
});
